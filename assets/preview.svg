<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Project Review Mind Map Template preview</title>
  <desc id="desc">A preview of the project review mind map structure with summary, risks, decisions, actions, RACI, and lessons.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="70" y="56" width="1060" height="518" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="600" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">Project Review Mind Map Template</text>
  <text x="600" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">判断・リスク・TODOを残すためのレビュー用マインドマップ</text>

  <g font-family="Arial, sans-serif">
    <rect x="452" y="254" width="296" height="94" rx="18" fill="#111827"/>
    <text x="600" y="294" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">レビュー本体</text>
    <text x="600" y="324" text-anchor="middle" font-size="15" fill="#d1d5db">結論から始める</text>

    <line x1="452" y1="301" x2="303" y2="205" stroke="#94a3b8" stroke-width="3"/>
    <line x1="452" y1="301" x2="300" y2="315" stroke="#94a3b8" stroke-width="3"/>
    <line x1="452" y1="301" x2="318" y2="430" stroke="#94a3b8" stroke-width="3"/>
    <line x1="748" y1="301" x2="902" y2="205" stroke="#94a3b8" stroke-width="3"/>
    <line x1="748" y1="301" x2="900" y2="315" stroke="#94a3b8" stroke-width="3"/>
    <line x1="748" y1="301" x2="882" y2="430" stroke="#94a3b8" stroke-width="3"/>

    <g>
      <rect x="116" y="168" width="238" height="74" rx="14" fill="#fee2e2" stroke="#fecaca"/>
      <text x="235" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">エグゼクティブサマリー</text>
      <text x="235" y="222" text-anchor="middle" font-size="13" fill="#7f1d1d">1分で状況を伝える</text>
    </g>

    <g>
      <rect x="116" y="278" width="238" height="74" rx="14" fill="#ffedd5" stroke="#fed7aa"/>
      <text x="235" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#9a3412">課題・リスク</text>
      <text x="235" y="332" text-anchor="middle" font-size="13" fill="#7c2d12">影響・確率・対応策</text>
    </g>

    <g>
      <rect x="116" y="392" width="238" height="74" rx="14" fill="#e0f2fe" stroke="#bae6fd"/>
      <text x="235" y="422" text-anchor="middle" font-size="18" font-weight="700" fill="#075985">意思決定ログ</text>
      <text x="235" y="446" text-anchor="middle" font-size="13" fill="#0c4a6e">決定者・根拠・影響</text>
    </g>

    <g>
      <rect x="846" y="168" width="238" height="74" rx="14" fill="#dcfce7" stroke="#bbf7d0"/>
      <text x="965" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">アクショントラッカー</text>
      <text x="965" y="222" text-anchor="middle" font-size="13" fill="#14532d">担当・期限・完了条件</text>
    </g>

    <g>
      <rect x="846" y="278" width="238" height="74" rx="14" fill="#ede9fe" stroke="#ddd6fe"/>
      <text x="965" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">関係者・RACI</text>
      <text x="965" y="332" text-anchor="middle" font-size="13" fill="#4c1d95">誰が決めるか</text>
    </g>

    <g>
      <rect x="846" y="392" width="238" height="74" rx="14" fill="#fef9c3" stroke="#fde68a"/>
      <text x="965" y="422" text-anchor="middle" font-size="18" font-weight="700" fill="#854d0e">学び・改善</text>
      <text x="965" y="446" text-anchor="middle" font-size="13" fill="#713f12">次回に活かす</text>
    </g>

    <rect x="260" y="514" width="680" height="34" rx="17" fill="#f1f5f9"/>
    <text x="600" y="536" text-anchor="middle" font-size="14" fill="#334155">XMind / OPML / FreeMind / Markdown / Mermaid / JSON / CSV / TSV</text>
  </g>
